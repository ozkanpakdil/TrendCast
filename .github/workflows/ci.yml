name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Lint & Typecheck ──────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  # ── Unit Tests (Vitest) ───────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  # ── E2E Tests (Playwright) ────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Restore the cross-run CPU/memory history written by the monitor
      - name: Restore resource history
        uses: actions/cache@v4
        with:
          path: resource-monitor/history.json
          key: trendcast-resource-history-${{ github.run_id }}
          restore-keys: trendcast-resource-history-

      # Wraps the Playwright run: fails if machine or single-tab CPU/memory
      # cross the thresholds; records peaks in the job summary and history.
      - name: Run Playwright tests (resource monitored)
        uses: ozkanpakdil/github-playwright-monitor@main
        with:
          run-command: bun run test:e2e
          machine-cpu-threshold: 80
          machine-memory-threshold: 80
          tab-cpu-threshold: 70
          tab-memory-threshold: 80

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload resource monitor reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resource-monitor-report
          path: |
            resource-monitor/
            monocart-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7