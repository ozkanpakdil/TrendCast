name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build (${{ matrix.target }})
        run: npm run build${{ matrix.target == 'firefox' && ':firefox' || '' }}
        env:
          TARGET: ${{ matrix.target == 'firefox' && 'firefox' || '' }}

      - name: Package extension
        run: |
          cd dist
          zip -r "../trendcast-${{ matrix.target }}-${GITHUB_REF_NAME:-${{ inputs.tag }}}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trendcast-${{ matrix.target }}
          path: trendcast-${{ matrix.target }}-*.zip
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*.zip