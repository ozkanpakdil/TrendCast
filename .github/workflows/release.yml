name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build (${{ matrix.target }})
        run: bun run build:${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}

      - name: Package extension
        run: |
          cd dist/${{ matrix.target }}
          zip -r "../../trendcast-${{ matrix.target }}-${GITHUB_REF_NAME:-${{ inputs.tag }}}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trendcast-${{ matrix.target }}
          path: trendcast-${{ matrix.target }}-*.zip
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*.zip